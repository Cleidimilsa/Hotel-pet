<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Configurações</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>🐾 Hotel Pet</h2>
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="reservas.html">Reservas</a>
            <a href="pets.html">Pets</a>
            <a href="usuarios.html">Usuários</a>
            <a href="configuracoes.html" class="menu-configuracoes">Configurações</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main class="container">
        <h1>Configurações do Hotel</h1>
        <p>Menu exclusivo do gerente para alterar diárias e número de vagas disponíveis.</p>

        <div class="card form-card">
            <form id="form-configuracoes">
                <div class="form-group">
                    <label for="valor-diaria">Valor da Diária (R$):</label>
                    <input type="number" id="valor-diaria" value="80.00" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="vagas-disponiveis">Número de Vagas Disponíveis:</label>
                    <input type="number" id="vagas-disponiveis" value="25" required>
                </div>

                <button type="button" class="btn">Salvar Configurações</button>
            </form>
        </div>
    </main>

    <script src="js/navigation.js"></script>
</body>
</html>
