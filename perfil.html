<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Perfil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>🐾 Hotel Pet</h2>
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="reservas.html">Reservas</a>
            <a href="pets.html">Pets</a>

    <main class="container">
        <h1>Perfil do Usuário</h1>
        <p>Altere suas informações de perfil.</p>

        <div class="card form-card">
            <form>
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" value="Gerente Geral" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" value="gerente@hotelpet.com" required>
                </div>

                <button type="button" class="btn">Salvar Alterações</button>
            </form>
        </div>
    </main>

    <script src="js/navigation.js"></script>
